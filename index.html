
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photographer Gallery</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

    <header>
        <h1>Photographer Gallery</h1>
        <p>Explore beautiful photographs</p>
        <p class="tagline">Every picture tells a story.</p>
    </header>

    <main>
        <div id="gallery" class="gallery"></div>
    </main>

    <div id="lightbox" class="lightbox">
        <button id="close" class="close">&times;</button>
        <button id="prev" class="nav prev">&#10094;</button>
        <img id="largeImage" src="" alt="Selected photograph">
        <button id="next" class="nav next">&#10095;</button>
        <div id="exif">Photo details will appear here.</div>
    </div>

    <footer>
        <p>Photographer Gallery App | DevOps Project</p>
    </footer>

</body>
</html>
